common:
  version: 1
  disable_existing_loggers: false
  formatters:
    file_formatter:
      (): uvicorn.logging.DefaultFormatter
      format: "%(levelprefix)s %(asctime)s.%(msecs)03d - [][%(name)s:%(lineno)d]: %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
      use_colors: false
    access_formatter:
      (): uvicorn.logging.AccessFormatter
      format: "%(levelprefix)s %(asctime)s.%(msecs)03d - [][%(name)s:%(lineno)d]: %(client_addr)s - \"%(request_line)s\" %(status_code)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
      use_colors: true
    default_formatter:
      (): uvicorn.logging.DefaultFormatter
      format: "%(levelprefix)s %(asctime)s.%(msecs)03d - [][%(name)s:%(lineno)d]: %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
      use_colors: true
    app_formatter:
      (): uvicorn.logging.DefaultFormatter
      format: "%(levelprefix)s %(asctime)s.%(msecs)03d - [%(request_id)s][%(name)s:%(lineno)d]: %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
      use_colors: true
  handlers:
    file_handler:
      class: logging.handlers.TimedRotatingFileHandler
      filename: ${APP_LOG_LOCATION:-logs}/scheduler_logger.log
      when: D
      interval: 1
      formatter: file_formatter
      backupCount: 30
    access_handler:
      class: logging.StreamHandler
      level: DEBUG
      formatter: access_formatter
      stream: ext://sys.stdout
    default_handler:
      class: logging.StreamHandler
      level: DEBUG
      formatter: default_formatter
      # stream: ext://sys.stderr
      stream: ext://sys.stdout
  loggers:
    root:
      level: INFO
    uvicorn:
      level: INFO
      propagate: false
      handlers: [ file_handler, default_handler ]
    uvicorn.access:
      level: INFO
      propagate: false
      handlers: [ file_handler, default_handler ]
    #  uvicorn.error:
    #    level: INFO
    #    propagate: false
    #    handlers: [ file_handler, access_handler ]
    sqlalchemy:
      level: WARNING
      propagate: false
      handlers: [ file_handler, default_handler ]
    sqlalchemy.engine:
      level: WARNING
      propagate: false
      handlers: [ file_handler, default_handler ]
    sqlalchemy.engine.Engine:
      level: WARNING
      propagate: false
      handlers: [ file_handler, default_handler ]
    sqlalchemy.orm:
      level: INFO
      propagate: false
      handlers: [ file_handler ]
    sqlalchemy.pool:
      level: INFO
      propagate: false
      handlers: [ file_handler, default_handler ]
    sqlalchemy.dialects:
      level: INFO
      propagate: false
      handlers: [ file_handler ]
    apscheduler:
      level: INFO
      propagate: false
      handlers: [ file_handler, default_handler ]
    app:
      level: INFO
      propagate: false
      handlers: [ file_handler, default_handler ]

