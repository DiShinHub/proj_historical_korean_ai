services:

  frontend-web:
    container_name: ${FRONTEND_WEB_NAME}-compose
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    ports:
      - "${FRONTEND_WEB_HOST_PORT}:3000"
    working_dir: /app
    command: npm run dev
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_FASTAPI_APP_HOST: ${NEXT_PUBLIC_FASTAPI_APP_HOST}
      NEXT_PUBLIC_FASTAPI_APP_PORT: ${NEXT_PUBLIC_FASTAPI_APP_PORT}
      NEXT_PUBLIC_API_TIMEOUT: "${NEXT_PUBLIC_API_TIMEOUT}"
    networks:
      - hk-ai-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hk-ai-network:
    external: true

volumes:
  node_modules:
  next_cache: